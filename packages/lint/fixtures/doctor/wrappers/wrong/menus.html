<!-- Angular: a button among the menu items, and a StatusDot with no name. -->
<ng-container dsDropdownMenu>
  <button dsButton dsDropdownMenuTrigger>Open the menu</button>
  <ng-template dsDropdownMenuContent>
    <div dsDropdownMenuItem>Rename file</div>
    <button dsButton>Delete file</button>
  </ng-template>
</ng-container>
<span dsStatusDot tone="success"></span>
